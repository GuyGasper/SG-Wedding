server {
    listen 8080;
    server_name sg2027wedding.com www.sg2027wedding.com;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location /images/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api {
        return 308 /api/;
    }

    # Preserve /api/; the Java app owns this prefix. Only HTTPS is exposed by the LB.
    location /api/ {
        proxy_pass http://sg-wedding-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # React client-side routes fall back to the built index document.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

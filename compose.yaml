services:
  api:
    image: ${API_IMAGE:-sg-wedding-api:local}
    build: ./backend
    platform: linux/arm64
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:uid=10001,gid=10001,mode=1770"]
    networks:
      default:
        aliases: [sg-wedding-api]
  frontend:
    image: ${FRONTEND_IMAGE:-sg-wedding-frontend:local}
    build: ./frontend
    platform: linux/arm64
    read_only: true
    user: "101:101"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:uid=101,gid=101,mode=1770"]
    ports: ["127.0.0.1:8088:8080"]
    depends_on: [api]
